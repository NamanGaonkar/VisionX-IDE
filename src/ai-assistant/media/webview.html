<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionX Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--vscode-sideBar-background, #0a0d14);
      color: var(--vscode-foreground, #cbd5e1);
      font-family: var(--vscode-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Minimalist Top Header */
    .chat-top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      border-bottom: 1px solid var(--vscode-panel-border, rgba(255, 255, 255, 0.08));
      background-color: var(--vscode-sideBar-background, #0a0d14);
      min-height: 36px;
    }
    .header-title-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      font-size: 12px;
      color: var(--vscode-foreground, #f1f5f9);
    }
    .header-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff5500;
      box-shadow: 0 0 6px rgba(255, 85, 0, 0.6);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .icon-btn {
      background: transparent;
      border: none;
      color: var(--vscode-foreground, #94a3b8);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .icon-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }
    .icon-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Collapsible Sessions Drawer */
    #sessions-drawer {
      display: none;
      flex-direction: column;
      background: #0f131f;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 10px;
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
    }
    .session-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      color: var(--vscode-foreground, #ccc);
    }
    .session-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .session-item.active {
      background: rgba(255, 85, 0, 0.15);
      color: #ffaa00;
      font-weight: 600;
    }
    .session-delete {
      color: #888;
      cursor: pointer;
      padding: 2px 4px;
    }
    .session-delete:hover {
      color: #ff4d4f;
    }
    .new-session-btn {
      width: 100%;
      padding: 5px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--vscode-foreground, #ccc);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      text-align: center;
    }
    .new-session-btn:hover {
      background: rgba(255, 85, 0, 0.15);
      color: #ffaa00;
      border-color: #ff5500;
    }

    /* Chat Messages Stream */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: text;
    }

    /* Empty State */
    .empty-state {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 0;
      color: #718096;
      font-size: 12px;
      line-height: 1.5;
    }
    .empty-title {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
    }

    /* Message Bubbles */
    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }
    .msg-user {
      align-self: flex-end;
      background: #161b2a;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 90%;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.45;
    }
    .msg-ai {
      align-self: flex-start;
      color: #e2e8f0;
      padding: 2px 0;
      width: 100%;
      font-size: 13px;
      line-height: 1.55;
    }

    /* Code Blocks */
    .code-container {
      background: #080a12;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      margin: 8px 0;
      overflow: hidden;
    }
    .code-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
      background: #0e121e;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      color: #888;
    }
    .code-action-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ccc;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      margin-left: 4px;
      transition: all 0.15s;
    }
    .code-action-btn:hover {
      background: rgba(255, 85, 0, 0.2);
      border-color: #ff5500;
      color: #ffaa00;
    }
    pre code {
      display: block;
      padding: 10px;
      overflow-x: auto;
      font-family: var(--vscode-editor-font-family, 'Consolas', monospace);
      font-size: 12px;
      color: #e2e8f0;
      line-height: 1.45;
    }

    /* Input Card Container */
    .input-wrapper {
      padding: 8px 10px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid var(--vscode-panel-border, rgba(255, 255, 255, 0.08));
    }
    .chat-input-box {
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0e121e;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 6px 8px;
      gap: 4px;
      transition: border-color 0.2s;
    }
    .chat-input-box:focus-within {
      border-color: #ff5500;
    }
    textarea.copilot-prompt {
      width: 100%;
      height: 48px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: #f1f5f9;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.4;
      padding: 2px 4px;
    }
    textarea.copilot-prompt::placeholder {
      color: #64748b;
    }

    /* Input Toolbar Row */
    .input-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 2px;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Model Pill */
    .model-pill {
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }
    .model-pill:hover {
      background: rgba(255, 85, 0, 0.15);
      border-color: #ff5500;
      color: #ffaa00;
    }
    .model-pill svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .send-arrow-btn {
      width: 24px;
      height: 24px;
      border-radius: 12px;
      background: #ff5500;
      color: #ffffff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: background 0.15s;
    }
    .send-arrow-btn:hover {
      background: #e04400;
    }

    /* Universal Provider Popover */
    #model-popover {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: #0d101a;
      border: 1px solid rgba(255, 85, 0, 0.35);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .popover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 600;
      font-size: 12px;
      color: #f1f5f9;
    }
    .popover-header span.close-x {
      cursor: pointer;
      color: #888;
      font-size: 14px;
    }
    .popover-header span.close-x:hover {
      color: #fff;
    }
    .popover-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .popover-row-inline {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .popover-row label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .popover-row select, .popover-row input {
      background: #141724;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }
    .popover-row select:focus, .popover-row input:focus {
      border-color: #ff5500;
    }
    .scan-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .scan-btn:hover {
      background: rgba(255, 85, 0, 0.2);
      border-color: #ff5500;
      color: #ffaa00;
    }
    .popover-status {
      font-size: 11px;
      color: #ff8800;
      min-height: 16px;
      word-break: break-word;
    }
    .popover-btns {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .popover-btns button {
      flex: 1;
      padding: 6px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      font-weight: 500;
    }
    .btn-primary {
      background: #ff5500;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #e04400;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ccc;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>
  <!-- Minimal Header -->
  <div class="chat-top-header">
    <div class="header-title-row">
      <span class="header-status-dot"></span>
      <span>VisionX Chat</span>
      <span style="font-size: 11px; color: #64748b; font-weight: normal;" id="active-session-name">(Main)</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="new-chat-btn" title="New Session">＋</button>
      <button class="icon-btn" id="sessions-toggle" title="View Sessions">≡</button>
      <button class="icon-btn" id="header-settings-btn" title="Configure AI Provider">
        <svg viewBox="0 0 16 16"><path d="M9.1 4.4L8.6 2H7.4l-.5 2.4-.7.3-2-1.3-.9.8 1.3 2-.2.7-2.5.5v1.2l2.5.5.3.8-1.4 1.9.8.8 2-1.4.7.3.5 2.4h1.2l.5-2.4.7-.3 2 1.3.8-.8-1.3-2 .3-.7 2.4-.5V7.6l-2.4-.5-.3-.7 1.3-2-.8-.8-2 1.3-.7-.3zM8 10c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Interactive Sessions Drawer -->
  <div id="sessions-drawer">
    <div id="sessions-list"></div>
    <button class="new-session-btn" id="drawer-new-session">+ Start New Conversation</button>
  </div>

  <!-- Chat Messages Stream -->
  <div class="chat-messages" id="chat-messages">
    <div class="empty-state" id="empty-state">
      <div class="empty-title">VisionX Workspace Chat</div>
      <div>Ask questions, analyze codebase architecture, refactor, or debug code with full context awareness.</div>
    </div>
  </div>

  <!-- Input Wrapper -->
  <div class="input-wrapper">
    <!-- BYOK Configuration Popover -->
    <div id="model-popover">
      <div class="popover-header">
        <span>BYOK Provider Configuration</span>
        <span class="close-x" id="pop-close-x">✕</span>
      </div>

      <div class="popover-row">
        <label>AI Provider</label>
        <select id="pop-provider">
          <option value="ollama_cloud">Ollama Online / Remote Cloud API (Any Host or URL)</option>
          <option value="ollama">Ollama Local (http://localhost:11434)</option>
          <option value="openrouter">OpenRouter (All Planetary Models)</option>
          <option value="openai">OpenAI Direct</option>
          <option value="anthropic">Anthropic Claude Direct</option>
          <option value="gemini">Google Gemini Direct</option>
          <option value="deepseek">DeepSeek Direct</option>
          <option value="groq">Groq (Ultra-Fast)</option>
          <option value="xai">xAI Grok Direct</option>
          <option value="mistral">Mistral AI Direct</option>
          <option value="together">Together AI</option>
          <option value="perplexity">Perplexity AI</option>
          <option value="cerebras">Cerebras</option>
          <option value="fireworks">Fireworks AI</option>
          <option value="cohere">Cohere</option>
          <option value="deepinfra">DeepInfra</option>
          <option value="sambanova">SambaNova Systems</option>
          <option value="hyperbolic">Hyperbolic</option>
          <option value="novita">Novita AI</option>
          <option value="lmstudio">LM Studio (Local / Offline)</option>
          <option value="custom">Custom / OpenAI-Compatible Endpoint</option>
        </select>
      </div>

      <div class="popover-row" id="pop-baseurl-row">
        <label>API Base URL</label>
        <input type="text" id="pop-base-url" placeholder="https://your-ollama-online.com or http://localhost:11434">
      </div>

      <div class="popover-row" id="pop-apikey-row">
        <label>API Key / Access Token</label>
        <input type="password" id="pop-api-key" placeholder="Paste your API key or Bearer token">
      </div>

      <div class="popover-row">
        <div class="popover-row-inline">
          <label>Model Name</label>
          <button type="button" class="scan-btn" id="pop-scan-btn" title="Discover available models from this endpoint">Scan Models</button>
        </div>
        <input type="text" id="pop-model" list="model-suggestions" placeholder="e.g. llama3.3, gpt-4o, claude-3-7-sonnet">
        <datalist id="model-suggestions"></datalist>
      </div>

      <div class="popover-status" id="pop-status">Select provider and configure credentials.</div>
      <div class="popover-btns">
        <button class="btn-primary" id="pop-save-btn">Save Configuration</button>
        <button class="btn-secondary" id="pop-cancel-btn">Cancel</button>
      </div>
    </div>

    <!-- Rounded Input Box -->
    <div class="chat-input-box">
      <textarea class="copilot-prompt" id="copilot-input" placeholder="Ask VisionX a question or reference @code..."></textarea>
      
      <div class="input-toolbar">
        <div class="toolbar-left">
          <label class="icon-btn" style="cursor:pointer;" title="Attach File/Context">
            ＋
            <input type="file" id="image-upload" accept="image/*" style="display:none;">
          </label>
          <div class="model-pill" id="model-pill-btn" title="Click to configure Model and API Key">
            <svg viewBox="0 0 16 16"><path d="M8 1a5 5 0 0 0-5 5c0 1.5.7 2.8 1.8 3.7A5 5 0 0 0 1 14h14a5 5 0 0 0-3.8-4.3A5 5 0 0 0 13 6a5 5 0 0 0-5-5zm-2 5a1 1 0 1 1 2 0 1 1 0 0 1-2 0zm4 0a1 1 0 1 1 2 0 1 1 0 0 1-2 0z"/></svg>
            <span id="model-pill-text">Claude 3.7 Sonnet</span>
          </div>
          <span id="attached-img-tag" style="display:none; font-size:11px; color:#ff8800; cursor:pointer;">[Image Attached ✕]</span>
        </div>
        
        <div class="toolbar-right">
          <span id="active-context-label" style="font-size:11px; color:#64748b; margin-right:4px;"></span>
          <button class="send-arrow-btn" id="send-btn" title="Send (Enter)">↑</button>
        </div>
      </div>
    </div>
  </div>

  <script src="{{WEBVIEW_JS_URI}}"></script>
</body>
</html>
