<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--vscode-editor-background, #1e1e1e);
      color: var(--vscode-foreground, #cccccc);
      font-family: var(--vscode-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Top Tabs Row (Native VS Code Copilot Chat style) */
    .chat-top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
      border-bottom: 1px solid var(--vscode-panel-border, rgba(128, 128, 128, 0.2));
      background-color: var(--vscode-sideBar-background, transparent);
      min-height: 35px;
    }
    .chat-tab-pill {
      background: var(--vscode-tab-activeBackground, rgba(255, 255, 255, 0.08));
      color: var(--vscode-tab-activeForeground, var(--vscode-foreground));
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .icon-btn {
      background: transparent;
      border: none;
      color: var(--vscode-foreground, #ccc);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
      opacity: 0.8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover {
      opacity: 1;
      background: var(--vscode-toolbar-hoverBackground, rgba(255, 255, 255, 0.1));
    }
    .icon-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Sessions Row */
    .sessions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--vscode-foreground, #ccc);
      font-weight: 600;
      border-bottom: 1px solid var(--vscode-panel-border, rgba(128, 128, 128, 0.15));
    }
    .sessions-actions {
      display: flex;
      gap: 4px;
    }

    /* Chat Messages Stream */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      user-select: text;
    }

    /* Empty State (Clean Copilot Tip style) */
    .empty-state {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 0;
    }
    .tip-card {
      background: var(--vscode-editorWidget-background, rgba(255, 255, 255, 0.03));
      border: 1px solid var(--vscode-widget-border, rgba(128, 128, 128, 0.2));
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--vscode-descriptionForeground, #999);
    }
    .tip-card strong {
      color: var(--vscode-foreground, #ccc);
    }

    /* Message Bubbles */
    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }
    .msg-user {
      align-self: flex-end;
      background: var(--vscode-badge-background, rgba(255, 255, 255, 0.08));
      color: var(--vscode-badge-foreground, var(--vscode-foreground));
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 90%;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.45;
    }
    .msg-ai {
      align-self: flex-start;
      color: var(--vscode-foreground);
      padding: 4px 0;
      width: 100%;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Code Blocks */
    .code-container {
      background: var(--vscode-textCodeBlock-background, rgba(0, 0, 0, 0.3));
      border: 1px solid var(--vscode-panel-border, rgba(128, 128, 128, 0.25));
      border-radius: 6px;
      margin: 8px 0;
      overflow: hidden;
    }
    .code-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
      background: var(--vscode-sideBar-background, rgba(255, 255, 255, 0.04));
      border-bottom: 1px solid var(--vscode-panel-border, rgba(128, 128, 128, 0.15));
      font-size: 11px;
      color: var(--vscode-descriptionForeground, #888);
    }
    .code-action-btn {
      background: transparent;
      border: 1px solid var(--vscode-button-border, rgba(128,128,128,0.3));
      color: var(--vscode-foreground);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      margin-left: 4px;
    }
    .code-action-btn:hover {
      background: var(--vscode-button-hoverBackground, rgba(255,255,255,0.1));
    }
    pre code {
      display: block;
      padding: 10px;
      overflow-x: auto;
      font-family: var(--vscode-editor-font-family, 'Consolas', monospace);
      font-size: 12px;
      color: var(--vscode-editor-foreground, inherit);
      line-height: 1.45;
    }

    /* Input Card Container */
    .input-wrapper {
      padding: 8px 10px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid var(--vscode-panel-border, rgba(128, 128, 128, 0.15));
    }
    .chat-input-box {
      border: 1px solid var(--vscode-input-border, rgba(128, 128, 128, 0.35));
      background: var(--vscode-input-background, #1e1e1e);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 6px 8px;
      gap: 4px;
      transition: border-color 0.2s;
    }
    .chat-input-box:focus-within {
      border-color: var(--vscode-focusBorder, #007acc);
    }
    textarea.copilot-prompt {
      width: 100%;
      height: 48px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--vscode-input-foreground, #cccccc);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.4;
      padding: 2px 4px;
    }
    textarea.copilot-prompt::placeholder {
      color: var(--vscode-input-placeholderForeground, #888);
    }

    /* Input Toolbar Row */
    .input-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 2px;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Model Pill inside Toolbar */
    .model-pill {
      background: var(--vscode-badge-background, rgba(255, 255, 255, 0.07));
      color: var(--vscode-foreground, #ccc);
      border: 1px solid var(--vscode-panel-border, rgba(128, 128, 128, 0.25));
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .model-pill:hover {
      background: var(--vscode-toolbar-hoverBackground, rgba(255, 255, 255, 0.15));
    }
    .model-pill svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .send-arrow-btn {
      width: 24px;
      height: 24px;
      border-radius: 12px;
      background: var(--vscode-button-background, #0078d4);
      color: var(--vscode-button-foreground, #ffffff);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: opacity 0.15s;
    }
    .send-arrow-btn:hover {
      background: var(--vscode-button-hoverBackground, #0060aa);
    }

    /* Footer Row underneath Input */
    .chat-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      font-size: 11px;
      color: var(--vscode-descriptionForeground, #888);
    }
    .footer-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .footer-right {
      display: flex;
      align-items: center;
    }

    /* Universal Provider Popover */
    #model-popover {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: var(--vscode-dropdown-background, var(--vscode-editor-background));
      border: 1px solid var(--vscode-dropdown-border, var(--vscode-panel-border));
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .popover-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .popover-row label {
      font-size: 11px;
      color: var(--vscode-descriptionForeground, #888);
      text-transform: uppercase;
      font-weight: 600;
    }
    .popover-row select, .popover-row input {
      background: var(--vscode-input-background, #1e1e1e);
      color: var(--vscode-input-foreground, #ccc);
      border: 1px solid var(--vscode-input-border, rgba(128,128,128,0.3));
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }
    .popover-row select:focus, .popover-row input:focus {
      border-color: var(--vscode-focusBorder, #007acc);
    }
    .popover-status {
      font-size: 11px;
      color: var(--vscode-textLink-foreground, #3794ff);
    }
    .popover-btns {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .popover-btns button {
      flex: 1;
      padding: 5px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: var(--vscode-button-background, #0078d4);
      color: var(--vscode-button-foreground, #ffffff);
    }
    .btn-secondary {
      background: var(--vscode-button-secondaryBackground, rgba(255,255,255,0.08));
      color: var(--vscode-button-secondaryForeground, var(--vscode-foreground));
    }
  </style>
</head>
<body>
  <!-- Top Header matching Native VS Code Chat -->
  <div class="chat-top-header">
    <div class="chat-tab-pill">
      <span>Chat</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="new-chat-btn" title="New Chat">＋</button>
      <button class="icon-btn" id="header-settings-btn" title="Configure AI Models">
        <svg viewBox="0 0 16 16"><path d="M9.1 4.4L8.6 2H7.4l-.5 2.4-.7.3-2-1.3-.9.8 1.3 2-.2.7-2.5.5v1.2l2.5.5.3.8-1.4 1.9.8.8 2-1.4.7.3.5 2.4h1.2l.5-2.4.7-.3 2 1.3.8-.8-1.3-2 .3-.7 2.4-.5V7.6l-2.4-.5-.3-.7 1.3-2-.8-.8-2 1.3-.7-.3zM8 10c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Sessions Bar -->
  <div class="sessions-bar">
    <span>Sessions</span>
    <div class="sessions-actions">
      <button class="icon-btn" id="refresh-chat-btn" title="Clear Session">↺</button>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-messages" id="chat-messages">
    <div class="empty-state" id="empty-state">
      <div class="tip-card">
        <strong>Tip:</strong> Ask questions, refactor code, or generate tests. Click the model pill below to select any model or provider.
      </div>
    </div>
  </div>

  <!-- Input Wrapper -->
  <div class="input-wrapper">
    <!-- Universal Provider & Model Configuration Popover -->
    <div id="model-popover">
      <div class="popover-row">
        <label>AI Provider</label>
        <select id="pop-provider">
          <option value="openrouter">OpenRouter (300+ Planetary Models: Claude, GPT, DeepSeek, Llama, Qwen)</option>
          <option value="custom">Custom / OpenAI-Compatible (Any Endpoint on Earth)</option>
          <option value="openai">OpenAI Direct</option>
          <option value="anthropic">Anthropic Claude Direct</option>
          <option value="gemini">Google Gemini Direct</option>
          <option value="deepseek">DeepSeek Direct</option>
          <option value="groq">Groq (Ultra-Fast)</option>
          <option value="mistral">Mistral AI Direct</option>
          <option value="together">Together AI</option>
          <option value="perplexity">Perplexity AI</option>
          <option value="cerebras">Cerebras</option>
          <option value="fireworks">Fireworks AI</option>
          <option value="cohere">Cohere</option>
          <option value="deepinfra">DeepInfra</option>
          <option value="sambanova">SambaNova Systems</option>
          <option value="hyperbolic">Hyperbolic</option>
          <option value="novita">Novita AI</option>
          <option value="ollama">Ollama (Local / Offline)</option>
          <option value="lmstudio">LM Studio (Local / Offline)</option>
        </select>
      </div>

      <div class="popover-row" id="pop-baseurl-row">
        <label>API Base URL</label>
        <input type="text" id="pop-base-url" placeholder="https://openrouter.ai/api/v1">
      </div>

      <div class="popover-row" id="pop-apikey-row">
        <label>API Key</label>
        <input type="password" id="pop-api-key" placeholder="Paste your API key here">
      </div>

      <div class="popover-row">
        <label>Active Model</label>
        <select id="pop-model">
          <option value="">Paste API key to discover models</option>
        </select>
      </div>

      <div class="popover-row">
        <label>Custom Model Override (Optional)</label>
        <input type="text" id="pop-custom-model" placeholder="e.g. anthropic/claude-3.7-sonnet">
      </div>

      <div class="popover-status" id="pop-status">Select provider and enter API key.</div>
      <div class="popover-btns">
        <button class="btn-primary" id="pop-save-btn">Save</button>
        <button class="btn-secondary" id="pop-cancel-btn">Cancel</button>
      </div>
    </div>

    <!-- Rounded Input Card -->
    <div class="chat-input-box">
      <textarea class="copilot-prompt" id="copilot-input" placeholder="Ask a question or type '/' for commands..."></textarea>
      
      <div class="input-toolbar">
        <div class="toolbar-left">
          <label class="icon-btn" style="cursor:pointer;" title="Attach File/Context">
            ＋
            <input type="file" id="image-upload" accept="image/*" style="display:none;">
          </label>
          <div class="model-pill" id="model-pill-btn" title="Configure AI Model and Provider">
            <svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 1 0 7 7 7 7 0 0 0-7-7zm0 13a6 6 0 1 1 6-6 6 6 0 0 1-6 6zm1-9H7v4h2zm0 6H7v2h2z"/></svg>
            <span id="model-pill-text">Claude 3.7 Sonnet</span>
          </div>
          <span id="attached-img-tag" style="display:none; font-size:11px; color:var(--vscode-textLink-foreground); cursor:pointer;">[Image Attached ✕]</span>
        </div>
        
        <div class="toolbar-right">
          <button class="send-arrow-btn" id="send-btn" title="Send (Enter)">↑</button>
        </div>
      </div>
    </div>

    <!-- Footer row underneath input -->
    <div class="chat-footer">
      <div class="footer-left">
        <span>VisionX</span>
      </div>
      <div class="footer-right">
        <span id="active-context-label">Ready</span>
      </div>
    </div>
  </div>

  <script src="{{WEBVIEW_JS_URI}}"></script>
</body>
</html>
